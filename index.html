<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Where Bharat Eats | Ultimate Restaurant Guide</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>🍛 Where Bharat Eats</h1>
        <p>Discover India's highest-rated, most popular, and healthiest dining spots</p>
    </header>

    <main>
        <!-- Filter Tabs -->
        <div class="tabs">
            <button class="tab-btn active" onclick="filterRestaurants('highly-rated')">⭐ Highly Rated</button>
            <button class="tab-btn" onclick="filterRestaurants('popular')">🔥 Most Popular</button>
            <button class="tab-btn" onclick="filterRestaurants('healthy')">🥗 Most Healthy</button>
        </div>

        <!-- Restaurant Grid -->
        <section id="restaurant-grid" class="grid">
            <!-- Content dynamically generated by script.js -->
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Where Bharat Eats. Made with ❤️ for Indian Foodies.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
